# Wheel-gate job spec — paste into `.github/workflows/ci.yml`
# (TODO-7: a human with the `workflows` permission must add this,
# because Arena's GitHub App token cannot update workflow files.)
#
# Local equivalent (no GitHub required):
#   python ci/wheel_gate.py            # build + duplicate-entry check
#   python ci/wheel_gate.py --install  # also smoke-test a clean venv

  wheel-gate:
    name: Wheel gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build wheel, reject duplicates, smoke-test install
        run: python ci/wheel_gate.py --install
