name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking until a repo admin enables Code scanning (Settings ->
    # Code security -> Code scanning). Until then analyze/upload returns 403.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

      - name: Report analysis status
        run: |
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "::warning::CodeQL analysis could not upload results. A repository admin must enable Code scanning (Settings -> Code security). Until then this job is advisory."
          else
            echo "CodeQL results uploaded for ${{ matrix.language }}."
          fi

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Users/azims/CBT
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (backend)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical findings (backend)"

      - name: npm audit (frontend)
        working-directory: Users/azims/CBT/frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical findings (frontend)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || echo "::warning::pip-audit reported findings"
