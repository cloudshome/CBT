# TEMPORARY diagnostic workflow — surfaces Jest failure text as ::error::
# annotations (readable via API) because action logs live on a host the
# sandbox cannot reach. DELETE before final merge.
name: diag-jest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Users/azims/CBT
    env:
      DATABASE_URL: "file:./dev.db"
      GEMINI_API_KEY: "ci-mock-gemini-api-key"
      PORT: "3000"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Users/azims/CBT/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Prisma init
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Jest (capture, never fail job)
        id: jest
        continue-on-error: true
        run: |
          npx jest --runInBand --coverage=false > /tmp/jest.log 2>&1
          echo "EXIT=$?" > /tmp/jest-meta.txt

      - name: Emit Jest diagnostics as annotations
        if: always()
        run: |
          echo "===META==="; cat /tmp/jest-meta.txt
          # Combine meta + head (suite summary) + tail (failure detail) into one file
          {
            echo "[meta] $(cat /tmp/jest-meta.txt)"
            echo "[--- suite summary ---]"
            grep -E "^(PASS|FAIL|Test Suites:|Tests:|Snapshot|Time:|Ran all)" /tmp/jest.log | head -60
            echo "[--- failure tail ---]"
            tail -60 /tmp/jest.log
          } > /tmp/jest-diag.txt
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' -e 's/::/%3A%3A/g')
            echo "::error title=JD$n::$esc"
          done < /tmp/jest-diag.txt
          echo "::notice::emitted $n annotation lines"
