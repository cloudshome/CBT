# TEMPORARY diagnostic workflow — pushes the full Jest log to a throwaway
# `diag-output` branch so the sandbox (which cannot reach the Actions log
# host) can read the real failure text. DELETE before final merge.
name: diag-jest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Users/azims/CBT
    env:
      DATABASE_URL: "file:./dev.db"
      GEMINI_API_KEY: "ci-mock-gemini-api-key"
      PORT: "3000"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Users/azims/CBT/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Prisma init
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Jest (same cmd as CI, capture, never fail job)
        id: jest
        continue-on-error: true
        run: |
          npm test -- --coverage > /tmp/jest.log 2>&1
          echo "JEST_EXIT=$?" > /tmp/jest-meta.txt

      - name: Publish full log to diag-output branch
        if: always()
        shell: bash
        run: |
          set +e
          repo_root="${GITHUB_WORKSPACE}"
          git config --global user.name "diag-bot"
          git config --global user.email "diag-bot@users.noreply.github.com"
          mkdir -p "$repo_root/.diag"
          cp /tmp/jest.log "$repo_root/.diag/jest-output.txt" 2>/dev/null
          cp /tmp/jest-meta.txt "$repo_root/.diag/jest-meta.txt" 2>/dev/null
          git -C "$repo_root" add .diag
          git -C "$repo_root" commit -m "diag output $(date +%s)" >/dev/null 2>&1
          git -C "$repo_root" push -f origin HEAD:diag-output 2>&1
          echo "PUSH_EXIT=$?"
