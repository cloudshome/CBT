# TEMPORARY diagnostic workflow — surfaces Jest failure text as ::error::
# annotations (readable via API) because action logs live on a host the
# sandbox cannot reach. DELETE before final merge.
name: diag-jest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Users/azims/CBT
    env:
      DATABASE_URL: "file:./dev.db"
      GEMINI_API_KEY: "ci-mock-gemini-api-key"
      PORT: "3000"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Users/azims/CBT/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Prisma init
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Jest (capture, never fail job)
        id: jest
        continue-on-error: true
        run: |
          npx jest --runInBand --coverage=false > /tmp/jest.log 2>&1
          echo "EXIT=$?" > /tmp/jest-meta.txt

      - name: Emit Jest diagnostics as annotations
        if: always()
        shell: bash
        run: |
          set +e
          cat /tmp/jest-meta.txt 2>/dev/null > /tmp/sum.txt
          grep -aE "^(PASS|FAIL|Test Suites|Tests:|Snapshots|Ran all)" /tmp/jest.log 2>/dev/null >> /tmp/sum.txt
          tail -n 4 /tmp/jest.log 2>/dev/null >> /tmp/sum.txt
          tail -n 60 /tmp/jest.log 2>/dev/null > /tmp/detail.txt
          enc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' -e 's/::/%3A%3A/g' < "$1"; }
          echo "::error title=JEST_SUMMARY::$(enc /tmp/sum.txt)"
          echo "::error title=JEST_DETAIL::$(enc /tmp/detail.txt)"
          exit 0
