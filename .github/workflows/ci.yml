name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Users/azims/CBT

    env:
      DATABASE_URL: "file:./dev.db"
      GEMINI_API_KEY: "ci-mock-gemini-api-key"
      PORT: "3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Users/azims/CBT/package-lock.json

      - name: Install Backend & Tooling Dependencies
        run: npm ci

      - name: Install Frontend PWA Dependencies
        run: npm --prefix frontend ci

      - name: Initialize Prisma Schema & Database
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: Users/azims/CBT/requirements*.txt

      - name: Install Python Quantitative Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Python Linter (Ruff)
        run: |
          ruff check core/ tests/
          ruff format --check core/ tests/

      - name: Run Python Quantitative Test Suite (Pytest)
        run: |
          pytest --tb=short

      - name: Run TypeScript Linter (ESLint)
        run: npm run lint

      - name: Run Automated Test Suite (Jest)
        run: npm test -- --coverage

      - name: Validate Docker Compose Configuration
        env:
          # docker-compose.prod.yml intentionally fails closed when CORS_ORIGIN
          # is unset; supply a representative value for config validation.
          CORS_ORIGIN: https://cbt.example.com
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.prod.yml config

      - name: Assert production Compose fails closed without CORS_ORIGIN
        run: |
          if docker compose -f docker-compose.prod.yml config >/dev/null 2>&1; then
            echo "::error::docker-compose.prod.yml must fail when CORS_ORIGIN is unset"
            exit 1
          fi
          echo "OK: production compose refuses to render without an explicit CORS_ORIGIN"

      - name: Build Full Production Bundle (Backend & Frontend)
        run: npm run build
