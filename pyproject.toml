[project]
name = "cryptobrain"
version = "4.0.0"
description = "Crypto Brain Terminal quantitative paper trading & desk platform"
requires-python = ">=3.11"

[project.scripts]
cryptobrain = "main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["node_modules", "dist", ".venv"]

[tool.ruff.lint]
# Curated quality gate: critical syntax + pyflakes, imports, bugbear,
# pyupgrade, blind-except, bandit-lite and simplification rules.
select = ["E", "F", "I", "B", "UP", "BLE", "S110", "RUF"]
ignore = ["E501", "RUF012", "B008", "B904", "E741"]

[tool.ruff.lint.per-file-ignores]
# Deliberate typographic characters (→, ×, ⚡, ℹ️) used in prose strings,
# docstrings and tests — not code issues.
"*.py" = ["RUF001", "RUF002", "RUF003", "BLE001"]
"tests/*" = ["F841", "RUF059", "RUF015", "E712", "B018", "S110"]
"web/*" = ["S110"]
"core/*" = ["S110"]
"brain/*" = ["S110", "F841", "RUF059", "RUF015", "RUF013", "RUF046", "E402"]
"data/*" = ["S110", "F841", "RUF059", "RUF015", "RUF013", "RUF046", "E402"]
"scripts/*" = ["E402", "S110", "F841", "RUF005", "UP015", "RUF059", "B007", "UP042", "B905", "RUF046"]
"deploy/*" = ["E402", "S110", "F841", "RUF059", "B007"]
"app.py" = ["RUF006", "RUF059", "F841"]



