[project]
name = "cryptobrain"
version = "4.0.0"
description = "Crypto Brain Terminal quantitative paper trading & desk platform"
requires-python = ">=3.11"

[project.scripts]
cryptobrain = "main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["node_modules", "dist", ".venv"]

[tool.ruff.lint]
# Curated quality gate: critical syntax + pyflakes, imports, bugbear,
# pyupgrade, blind-except, bandit-lite and simplification rules.
select = ["E", "F", "I", "B", "UP", "BLE", "S110", "RUF"]
ignore = ["E501", "RUF012", "B008", "B904", "E741"]

[tool.ruff.lint.per-file-ignores]
# Deliberate typographic characters (→, ×, ⚡, ℹ️) used in prose strings,
# docstrings and tests — not code issues.
"*.py" = ["RUF001", "RUF002", "RUF003", "BLE001"]
"tests/*" = ["F841", "RUF059", "RUF015", "E712", "B018", "S110"]
"web/*" = ["S110"]
"core/*" = ["S110"]
"brain/*" = ["S110", "F841", "RUF059", "RUF015", "RUF013", "RUF046", "E402"]
"data/*" = ["S110", "F841", "RUF059", "RUF015", "RUF013", "RUF046", "E402"]
"scripts/*" = ["E402", "S110", "F841", "RUF005", "UP015", "RUF059", "B007", "UP042", "B905", "RUF046"]
"deploy/*" = ["E402", "S110", "F841", "RUF059", "B007"]
"app.py" = ["RUF006", "RUF059", "F841"]
"cli/*" = ["S110", "F841"]
"engine/*" = ["S110", "F841", "RUF046", "RUF005", "B905"]
"main.py" = ["S110", "F841"]
"ops/*" = ["S110", "F841"]
"sky_agent/*" = ["S110", "F841", "B007", "B023"]
"audit/*" = ["E402", "F841", "S110"]
"packaging/*" = ["E402", "F841"]
"integrations/*" = ["RUF100", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "core.risk.*",
    "core.execution.*",
    "core.correlation_context",
    "core.database_migrations",
    "core.database_recovery",
    "core.slo_monitor",
    "core.streaming_backpressure",
]
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["core", "engine", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false




