[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobrain"
version = "2.1.0"
description = "Multi-source, multi-indicator trading signal engine for BTC, ETH, and XAUUSD/GOLD. Read-only by design — never places an exchange order."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azimshawon" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ops = ["gunicorn>=22.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
cryptobrain = "main:main"

[project.urls]
Homepage = "https://github.com/Azimshawon/SKY"
Repository = "https://github.com/Azimshawon/SKY"
Issues = "https://github.com/Azimshawon/SKY/issues"

[tool.setuptools]
py-modules = ["main", "config", "mcp_server"]

[tool.setuptools.packages.find]
include = ["cryptobrain*", "brain*", "engine*", "data*", "ai*", "output*", "web*"]
exclude = ["tests*", "ops*", "docs*", "ci*"]
