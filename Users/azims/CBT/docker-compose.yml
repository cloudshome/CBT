version: '3.8'

# =============================================================================
# SKY / Crypto Brain Terminal — Production-Hardened Docker Compose
#
# Services:
#   python-backend  → FastAPI + uvicorn (port 8000) — Core intelligence engine
#   backend         → Node/Express + Prisma (port 3000) — Paper trading + candles
#   frontend        → Nginx + React build (port 80) — Terminal UI
#
# Nginx routes /api/sky/*, /api/decision/*, /api/market/*, /ws/* → python-backend:8000
# Nginx routes /api/candles, /api/paper, /api/desk, etc → backend:3000
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Python FastAPI — Market Intelligence Engine (12-stage SKY pipeline)
  # ---------------------------------------------------------------------------
  python-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sky_python_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3000M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Node/Express — Paper Trading, Candles, Desk, Tickers (Prisma + SQLite)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sky_node_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
    depends_on:
      python-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Nginx — React terminal UI + reverse proxy to both backends
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sky_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      python-backend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
