version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ctb-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BINANCE_API_URL=${BINANCE_API_URL:-https://api.binance.com}
      - BYBIT_API_URL=${BYBIT_API_URL:-https://api.bybit.com}
    volumes:
      - ctb-data:/app/data
    ports:
      - "3000:3000"
    networks:
      - ctb-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ctb-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ctb-network

volumes:
  ctb-data:
    name: ctb-sqlite-data

networks:
  ctb-network:
    name: ctb-network
    driver: bridge
