version: '3.8'

services:
  ai_quant_sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt_quant_sentinel
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
