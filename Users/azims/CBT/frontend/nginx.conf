server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security Headers (OWASP Recommended)
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Gzip compression for high performance
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ---------------------------------------------------------------------------
    # Common proxy headers (shared macro)
    # ---------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------------------------
    # Python FastAPI Backend (port 8000)
    # Routes: /api/sky, /api/decision, /api/prediction, /api/scenarios,
    #         /api/path-simulation, /api/shadow, /api/lab, /api/governance,
    #         /api/league, /api/command, /api/market, /api/dossier, /api/smc,
    #         /api/voice, /api/telegram, /api/ingest, /api/strategy,
    #         /api/macro, /api/audit, /api/chart, /api/memory, /api/ai
    # ---------------------------------------------------------------------------
    location /api/sky/ {
        proxy_pass http://python-backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
    location /api/decision/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/prediction/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/scenarios {
        proxy_pass http://python-backend:8000;
    }
    location /api/path-simulation {
        proxy_pass http://python-backend:8000;
    }
    location /api/shadow/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/lab/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/governance/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/league/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/command/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/market/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/dossier {
        proxy_pass http://python-backend:8000;
    }
    location /api/smc/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/voice/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/telegram/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/ingest/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/strategy/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/macro/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/audit/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/microstructure/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/execution/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/auditor/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/chart/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/memory/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/ai/ {
        proxy_pass http://python-backend:8000;
    }
    location /api/health {
        proxy_pass http://python-backend:8000;
    }

    # WebSocket terminal endpoint (Python FastAPI)
    location /ws/ {
        proxy_pass http://python-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------------
    # Node/Express Backend (port 3000)
    # Routes: /api/candles, /api/mtf, /api/scan, /api/paper,
    #         /api/desk, /api/tickers, /api/institutional, /api/readiness
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ---------------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------------

    # PWA Service Worker & Manifest: Never cache so updates apply immediately
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
