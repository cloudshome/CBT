<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#161B26" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#232B3E" stroke-width="8" />

  <!-- Quant Grid background lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#1F2839" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1F2839" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="80" y1="380" x2="432" y2="380" stroke="#1F2839" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Candlesticks in background -->
  <!-- Candle 1 (Green) -->
  <line x1="150" y1="160" x2="150" y2="360" stroke="#00FF9D" stroke-width="4" opacity="0.6" />
  <rect x="138" y="200" width="24" height="120" rx="4" fill="#00FF9D" opacity="0.7" />

  <!-- Candle 2 (Cyan Impulsive) -->
  <line x1="256" y1="110" x2="256" y2="410" stroke="#00F0FF" stroke-width="5" filter="url(#glow)" />
  <rect x="240" y="150" width="32" height="200" rx="6" fill="#00F0FF" filter="url(#glow)" />

  <!-- Candle 3 (Red) -->
  <line x1="362" y1="220" x2="362" y2="390" stroke="#FF3B69" stroke-width="4" opacity="0.6" />
  <rect x="350" y="250" width="24" height="90" rx="4" fill="#FF3B69" opacity="0.7" />

  <!-- Overlay CTB Brain Nodes / Network -->
  <circle cx="150" cy="200" r="10" fill="#00FF9D" filter="url(#glow)" />
  <circle cx="256" cy="150" r="14" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="362" cy="250" r="10" fill="#FF3B69" filter="url(#glow)" />
  <path d="M 150 200 Q 200 130 256 150 T 362 250" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Bottom Brand Text -->
  <text x="256" y="455" fill="#00F0FF" font-size="42" font-weight="bold" font-family="monospace" text-anchor="middle" letter-spacing="4">CTB DESK</text>
</svg>
